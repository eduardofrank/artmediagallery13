# Full CKEditor 5 preset for Artmedia Gallery (TYPO3 core Full + typo3image).
# Import base layers only — do NOT import Full.yaml or rte_ckeditor_image/Default.yaml
# (that would merge duplicate toolbars). Plugin.yaml adds the image module only.

imports:
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }
    - { resource: 'EXT:rte_ckeditor_image/Configuration/RTE/Plugin.yaml' }

editor:
  config:
    contentsCss:
      - 'EXT:rte_ckeditor/Resources/Public/Css/contents.css'
      - 'EXT:bootstrap_package/Resources/Public/Css/bootstrap5-rte.min.css'
      - 'EXT:rte_ckeditor_image/Resources/Public/Css/editor-image-widget.css'
      - 'EXT:rte_ckeditor_image/Resources/Public/Css/image-alignment.css'

    style:
      definitions:
        - { name: 'Orange title H2', element: 'h2', classes: ['orange'] }
        - { name: 'Orange title H3', element: 'h3', classes: ['orange'] }
        - { name: 'Quote / Citation', element: 'blockquote' }
        - { name: 'Code block', element: 'code' }
        - { name: 'Yellow marker', element: 'span', classes: ['yellow-marker'] }

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading1', view: 'h1', title: 'Heading 1' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4' }
        - { model: 'formatted', view: 'pre', title: 'Pre-Formatted Text' }

    toolbar:
      items:
        - removeFormat
        - undo
        - redo
        - '|'
        - findAndReplace
        - link
        - insertimage
        - '|'
        - insertTable
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - '|'
        - selectAll
        - '|'
        - sourceEditing
        - showBlocks
        - horizontalLine
        - '-'
        - bold
        - italic
        - underline
        - strikethrough
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - indent
        - outdent
        - alignment
        - '|'
        - specialCharacters
        - '-'
        - style
        - heading
        - fontFamily
        - fontBackgroundColor
        - fontColor
        - fontSize
        - textPartLanguage
        - highlight
        - highlight:greenMarker
        - '|'
        - fullscreen

    alignment:
      options:
        - { name: 'left', className: 'text-start' }
        - { name: 'center', className: 'text-center' }
        - { name: 'right', className: 'text-end' }
        - { name: 'justify', className: 'text-justify' }

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption

    fontColor:
      colors:
        - { label: 'Orange', color: '#ff8700' }
        - { label: 'Blue', color: '#0080c9' }
        - { label: 'Green', color: '#209d44' }
        - { label: 'Muted gray', color: '#7c939b' }

    fontBackgroundColor:
      colors:
        - { label: 'Stage orange light', color: '#fab85c' }

    fontFamily:
      options:
        - 'default'
        - 'Arial, sans-serif'

    fontSize:
      options:
        - 'default'
        - 12
        - 14
        - 16
        - 18
        - 20
        - 21

    list:
      properties:
        styles: true
        startIndex: true
        reversed: true

    indentBlock:
      classes:
        - 'ps-2'
        - 'ps-3'
        - 'ps-4'

    language:
      textPartLanguage:
        - { title: 'English', languageCode: 'en' }
        - { title: 'French', languageCode: 'fr' }
        - { title: 'German', languageCode: 'de' }

    highlight:
      options:
        - { model: 'yellowMarker', class: 'marker-yellow', title: 'Yellow marker', type: 'marker', color: 'var(--ck-content--highlight-marker-yellow)' }
        - { model: 'greenMarker', class: 'marker-green', title: 'Green marker', type: 'marker', color: 'var(--ck-content-highlight-marker-green)' }
        - { model: 'redPen', class: 'pen-red', title: 'Red pen', type: 'pen', color: 'var(--ck-content-highlight-pen-red)' }

    typo3image:
      toolbar:
        - editTypo3Image
        - '|'
        - imageStyle:image-left
        - imageStyle:image-center
        - imageStyle:image-right
        - '|'
        - imageStyle:image-inline
        - imageStyle:image-block

    importModules:
      - { module: '@ckeditor/ckeditor5-word-count', exports: ['WordCount'] }
      - { module: '@ckeditor/ckeditor5-font', exports: ['Font'] }
      - { module: '@ckeditor/ckeditor5-show-blocks', exports: ['ShowBlocks'] }
      - { module: '@ckeditor/ckeditor5-language', exports: ['TextPartLanguage'] }
      - { module: '@ckeditor/ckeditor5-highlight', exports: ['Highlight'] }
      - { module: '@ckeditor/ckeditor5-list', exports: ['ListProperties'] }
      - { module: '@ckeditor/ckeditor5-fullscreen', exports: ['Fullscreen'] }
