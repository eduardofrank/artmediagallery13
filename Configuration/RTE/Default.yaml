# Site RTE preset for TYPO3 13 / CKEditor 5
# Base on rte_ckeditor_image (includes typo3image plugin). Do not override
# importModules here — that would remove the image plugin module.

imports:
    - { resource: 'EXT:rte_ckeditor_image/Configuration/RTE/Default.yaml' }

editor:
  config:
    contentsCss:
      - 'EXT:bootstrap_package/Resources/Public/Css/bootstrap5-rte.min.css'
      - 'EXT:rte_ckeditor_image/Resources/Public/Css/image-alignment.css'

    style:
      definitions:
        - { name: 'Quote / Citation', element: 'blockquote' }
        - { name: 'Yellow marker', element: 'span', classes: ['yellow-marker'] }
        - { name: 'Code inline', element: 'code' }

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading1', view: 'h1', title: 'Heading 1' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4' }
        - { model: 'formatted', view: 'pre', title: 'Pre-Formatted Text' }

    toolbar:
      items:
        - undo
        - redo
        - '|'
        - findAndReplace
        - selectAll
        - '|'
        - link
        - insertTable
        - insertimage
        - horizontalLine
        - specialCharacters
        - '|'
        - sourceEditing
        - showBlocks
        - '-'
        - bold
        - italic
        - underline
        - strikethrough
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - indent
        - outdent
        - alignment
        - '|'
        - removeFormat
        - '-'
        - style
        - heading
        - fontFamily
        - fontSize
        - fontColor
        - fontBackgroundColor

    alignment:
      options:
        - { name: 'left', className: 'text-start' }
        - { name: 'center', className: 'text-center' }
        - { name: 'right', className: 'text-end' }
        - { name: 'justify', className: 'text-justify' }

    fontColor:
      colors:
        - { label: 'Orange', color: '#ff8700' }
        - { label: 'Blue', color: '#0080c9' }
        - { label: 'Green', color: '#209d44' }
        - { label: 'Muted gray', color: '#7c939b' }

    fontBackgroundColor:
      colors:
        - { label: 'Stage orange light', color: '#fab85c' }

    fontFamily:
      options:
        - 'default'
        - 'Arial, sans-serif'

    fontSize:
      options:
        - 'default'
        - 12
        - 14
        - 16
        - 18
        - 20

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption

    typo3image:
      toolbar:
        - editTypo3Image
        - '|'
        - imageStyle:image-left
        - imageStyle:image-center
        - imageStyle:image-right
        - '|'
        - imageStyle:image-inline
        - imageStyle:image-block

    importModules:
      - '@netresearch/rte-ckeditor-image/Plugins/typo3image.js'
      - { module: '@ckeditor/ckeditor5-font', exports: ['Font'] }
      - { module: '@ckeditor/ckeditor5-show-blocks', exports: ['ShowBlocks'] }
